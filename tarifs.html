<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prices | Cargolac</title>
  <meta name="description" content="Cargolac: van rental website (portfolio project by Eliot Ilazi). Fleet, live booking with prices, FR / SQ / EN.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="wrap page-head">
      <h1 data-t="prices_title"></h1>
      <p class="lead" data-t="prices_lead"></p>
    </div>
    <section class="wrap" style="padding-top:20px">
      <div class="table-wrap"><table class="data" id="rates"></table></div>
    </section>
    <section class="wrap" style="padding-top:0">
      <div class="two">
        <div><h2 data-t="ins_title"></h2><div class="table-wrap"><table class="data" id="ins"></table></div></div>
        <div><h2 data-t="extras_title"></h2><div class="table-wrap"><table class="data" id="extras"></table></div></div>
      </div>
    </section>
    <section class="wrap" style="padding-top:0">
      <div class="two">
        <div class="card"><h2 data-t="km_title"></h2><p class="muted" data-t="km_text"></p></div>
        <div class="card"><h2 data-t="rules_title"></h2><ul class="muted"><li data-t="rule1"></li><li data-t="rule2"></li><li data-t="rule3"></li></ul></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="prices.js"></script>
</body>
</html>
