<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vehicles | Cargolac</title>
  <meta name="description" content="Cargolac: van rental website (portfolio project by Eliot Ilazi). Fleet, live booking with prices, FR / SQ / EN.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="wrap page-head">
      <h1 data-t="fleet_title"></h1>
      <p class="lead" data-t="fleet_lead"></p>
    </div>
    <section class="wrap" style="padding-top:20px">
      <div class="toolbar">
        <div class="chips" id="cats" role="group"></div>
        <label class="check"><input type="checkbox" id="onlyB"> <span data-t="filter_b"></span></label>
        <label class="f" style="margin-left:auto"><span data-t="sort"></span><select id="sort"></select></label>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="grid" id="fleet"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="fleet.js"></script>
</body>
</html>
